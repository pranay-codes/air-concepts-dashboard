# INF-006: build the React app with the environment's public settings from Parameter Store.
# Needs setup-environment in the same job. The output is frontend/dist.
name: Build frontend
description: Read the public frontend settings from Parameter Store and build the app.
runs:
  using: composite
  steps:
    - name: Read the public frontend settings from Parameter Store
      shell: bash
      run: |
        set -euo pipefail
        aws ssm get-parameters-by-path --path "${SSM_PREFIX}frontend/" --recursive \
          --query 'Parameters[].[Name,Value]' --output text > frontend-params.tsv
        found=" "
        while IFS=$'\t' read -r name value; do
          case "$name" in
            "${SSM_PREFIX}frontend/api-base-url") key=VITE_API_BASE_URL ;;
            "${SSM_PREFIX}frontend/supabase-url") key=VITE_SUPABASE_URL ;;
            "${SSM_PREFIX}frontend/supabase-publishable-key") key=VITE_SUPABASE_PUBLISHABLE_KEY ;;
            *) continue ;;
          esac
          echo "$key=$value" >> "$GITHUB_ENV"
          found="$found$key "
        done < frontend-params.tsv
        rm -f frontend-params.tsv
        # A missing parameter would otherwise build a bundle with blank settings that fails in the browser.
        for key in VITE_API_BASE_URL VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY; do
          case "$found" in
            *" $key "*) ;;
            *) echo "Missing frontend setting: $key. Set its ${SSM_PREFIX}frontend/ parameter, then re-run." >&2; exit 1 ;;
          esac
        done
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Build the frontend
      shell: bash
      working-directory: frontend
      run: |
        npm ci --silent
        npm run build --silent
