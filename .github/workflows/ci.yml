# CI-001: quality and security checks on pull requests. Test environment only.
# No AWS credentials, no deployment, and no secrets are used here.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers starts a disposable PostgreSQL here. No test reaches a hosted project.
      - run: ./mvnw -q -B verify

  frontend:
    name: Frontend (Node LTS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint --silent
      - run: npm run typecheck --silent
      - run: npm test --silent
      - run: npm run build --silent
      - run: npm run api:check --silent
      - run: npm audit --audit-level=high

  e2e:
    # QA-001 AC-6 and AC-8. Playwright against the API started with placeholder settings. No hosted project is contacted.
    name: Playwright (smoke and API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Placeholder values only, the same as backend/src/test/resources/application-test.yml.
      SPRING_PROFILES_ACTIVE: ci
      DATABASE_URL: jdbc:postgresql://placeholder.supabase.co:5432/postgres?sslmode=require
      DATABASE_USER: placeholder
      DATABASE_PASSWORD: placeholder
      SUPABASE_JWT_ISSUER_URI: https://placeholder.supabase.co/auth/v1
      SUPABASE_JWKS_URI: https://placeholder.supabase.co/auth/v1/.well-known/jwks.json
      SUPABASE_TEST_PROJECT_REF: placeholder
      VITE_API_BASE_URL: http://localhost:8080
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start API
        working-directory: backend
        # Compile first: spring-boot:start finds the main class in target/classes, which a clean checkout lacks.
        run: |
          ./mvnw -q -B -DskipTests compile
          ./mvnw -q -B spring-boot:start
      - name: Wait for API
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/me || true)
            if [ "$code" != "000" ]; then exit 0; fi
            sleep 1
          done
          echo "API did not answer on port 8080" >&2
          exit 1
      - run: npm run e2e
        working-directory: frontend
        env:
          E2E_LOCAL_API: "true"
      - name: Stop API
        if: always()
        working-directory: backend
        run: ./mvnw -q -B spring-boot:stop

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, so gitleaks can scan every commit in the pull request.
          fetch-depth: 0
      # Installs a pinned gitleaks release and checks it against the published SHA-256 sums.
      # Used directly, not through a third-party action, because this repo's Actions policy blocks those.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          version=8.30.1
          base=https://github.com/gitleaks/gitleaks/releases/download/v${version}
          archive=gitleaks_${version}_linux_x64.tar.gz
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl -sSfL -O "$base/$archive" -O "$base/gitleaks_${version}_checksums.txt"
          grep -F " $archive" gitleaks_${version}_checksums.txt | sha256sum -c -
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: gitleaks git --log-opts="${BASE_SHA}..${HEAD_SHA}" --redact --no-banner --exit-code 1
