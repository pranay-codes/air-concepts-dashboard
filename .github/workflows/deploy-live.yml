# INF-006: promote one tested release to the Live environment. Manual only.
# Spec: docs/specs/INF-006-live-environment.md. Plan: docs/plans/INF-006.md. Runbook: docs/live-environment-runbook.md.
#
# A release is a GitHub release tag on main, for example https://github.com/pranay-codes/air-concepts-dashboard/releases/tag/v0.1.
# Its release notes carry the Tag, Commit and Image lines that the Test deploy printed. The tag's commit must already
# have been deployed to Test. This workflow checks those lines against Test, copies that exact image into the Live
# repository, applies reviewed migrations, deploys through SSM and records what it did. Rollback redeploys the last known-good release from the record.
# Every environment value comes from infra/environments/live.json through the shared actions in .github/actions/.
name: deploy-live

on:
  workflow_dispatch:
    inputs:
      mode:
        description: release promotes a tested release; rollback redeploys the last known-good release.
        type: choice
        options: [release, rollback]
        default: release
      release_tag:
        description: "release: the version tag to promote, such as v0.1 or its releases/tag URL. Its release notes need the Tag, Commit and Image lines printed by the Test deploy. The tag must be on main and already deployed to Test."
        type: string
        default: ""
      confirm:
        description: Type DEPLOY LIVE to continue.
        type: string
        default: ""
      backup_confirmed:
        description: "release: I confirmed a recent Supabase production backup or recovery point exists."
        type: boolean
        default: false
      destructive_ack:
        description: "release: a human reviewed every DROP, TRUNCATE or unscoped DELETE flagged in the pending migrations."
        type: boolean
        default: false

permissions:
  contents: read

# One release at a time, and never cancel one that is half done.
concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  guard:
    name: check the request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse anything that is not a deliberate release from main
        id: resolve
        env:
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRM: ${{ inputs.confirm }}
          BACKUP_CONFIRMED: ${{ inputs.backup_confirmed }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fail() { echo "REFUSED: $*" >&2; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "run this workflow from the main branch, not $GITHUB_REF"
          [ "$CONFIRM" = "DEPLOY LIVE" ] || fail "type DEPLOY LIVE in the confirm input"
          if [ "$MODE" = "rollback" ]; then
            echo "Rollback requested; the last known-good release is read from the release record."
            exit 0
          fi
          [ "$BACKUP_CONFIRMED" = "true" ] || fail "confirm a recent production backup first (backup_confirmed)"

          # The tag is the only release input: a version tag such as v0.1, or the releases/tag URL of this repository.
          url_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/tag/"
          case "$RELEASE_TAG" in
            "$url_prefix"*) tag="${RELEASE_TAG#"$url_prefix"}" ;;
            *://*) fail "release_tag must be a release of this repository: ${url_prefix}<tag>" ;;
            *) tag="$RELEASE_TAG" ;;
          esac
          [[ "$tag" =~ ^v[0-9]+(\.[0-9]+)+$ ]] || fail "release_tag must be a version tag such as v0.1"
          published="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          [ "$published" = "$tag" ] || fail "$tag is not a published GitHub release"
          # The release notes name the release and the Test deploy: Tag, Commit and Image lines, copied from the Test summary.
          notes="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          notes_field() { printf '%s\n' "$notes" | tr -d '\r' | sed -n "s/^$1:[[:space:]]*//p" | head -n 1 | sed 's/[[:space:]]*$//'; }
          notes_tag="$(notes_field Tag)"
          notes_commit="$(notes_field Commit)"
          notes_image="$(notes_field Image)"
          [ "$notes_tag" = "$tag" ] || fail "the release notes of $tag need the line 'Tag: $tag' (found '${notes_tag:-none}')"
          git rev-parse -q --verify "refs/tags/$tag" > /dev/null || fail "the repository has no tag $tag"
          sha="$(git rev-list -n 1 "refs/tags/$tag")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || fail "tag $tag does not name a commit"
          [ "$notes_commit" = "$sha" ] || fail "the release notes of $tag say Commit '${notes_commit:-none}', but $tag points at $sha"
          git merge-base --is-ancestor "$sha" origin/main || fail "tag $tag is not on the main branch"

          # The release must already have gone through Test: the app deploy and the Test migration run both succeeded.
          image_tag=""
          for workflow in deploy-test.yml supabase-migrations.yml; do
            run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?head_sha=${sha}&branch=main&status=success&per_page=1" --jq '.workflow_runs[0] | select(. != null) | "\(.id) \(.run_attempt)"')"
            [ -n "$run" ] || fail "no successful $workflow run on main for tag $tag; deploy it to Test first"
            # The app deploy tags its image <commit>-<run id>-<run attempt>, so that tag names the image to promote.
            if [ "$workflow" != supabase-migrations.yml ]; then image_tag="${sha}-${run// /-}"; fi
          done
          [ "$notes_image" = "$image_tag" ] || fail "the release notes of $tag say Image '${notes_image:-none}', but the deploy for $sha pushed '$image_tag'"
          echo "Release $tag ($sha) passed the Test gates; the release notes match the Test image."
          {
            echo "release_tag=$tag"
            echo "release_sha=$sha"
            echo "image_tag=$image_tag"
          } >> "$GITHUB_OUTPUT"

  release:
    name: release to Live
    needs: guard
    if: inputs.mode == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: live
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.guard.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.guard.outputs.release_sha }}
      BUILD_IMAGE_TAG: ${{ needs.guard.outputs.image_tag }}
    steps:
      # Everything below runs from the release commit, so the Compose file, Caddyfile, deploy script,
      # migrations and frontend are exactly what Test ran.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.release_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          environment: live
          require-complete: "true"

      - name: Confirm the target is the Live instance
        run: |
          set -euo pipefail
          tag="$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].Tags[?Key==`environment`].Value | [0]' --output text)"
          if [ "$tag" != "live" ]; then
            echo "REFUSED: instance $INSTANCE_ID is tagged environment=$tag, expected live" >&2
            exit 1
          fi

      - name: Read the current release record
        run: |
          set -euo pipefail
          current="$(aws ssm get-parameter --name "${SSM_PREFIX}release/current" --query Parameter.Value --output text 2>/dev/null || true)"
          echo "PREVIOUS_RELEASE_RECORD=${current:-none}" >> "$GITHUB_ENV"

      - name: Find the backend image built for this release
        run: |
          set -euo pipefail
          test_uri="$(python3 infra/scripts/environment_config.py get test ecrRepositoryUri)"
          test_repo="${test_uri#*/}"
          digest="$(aws ecr describe-images --repository-name "$test_repo" --image-ids "imageTag=$BUILD_IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "REFUSED: image $BUILD_IMAGE_TAG in $test_repo is not tagged; the app deploy for $RELEASE_TAG did not push it" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
          echo "Found the backend image for $RELEASE_TAG (commit $RELEASE_SHA)."

      - name: Confirm the image is in the shared repository
        run: |
          set -euo pipefail
          # One repository serves both environments, so nothing is copied and the digest cannot change.
          # Live deploys the exact digest the build pushed.
          repo="${ECR_REPOSITORY_URI#*/}"
          found="$(aws ecr describe-images --repository-name "$repo" --image-ids "imageDigest=$IMAGE_DIGEST" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          if [ "$found" != "$IMAGE_DIGEST" ]; then
            echo "REFUSED: $IMAGE_DIGEST is not in $ECR_REPOSITORY_URI. Nothing was deployed." >&2
            exit 1
          fi
          echo "Confirmed $IMAGE_DIGEST in $ECR_REPOSITORY_URI, the digest from the build."
      - name: List the migrations this release would apply
        uses: ./.github/actions/supabase-migrate
        with:
          project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          expected-project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_LIVE_ACCESS_TOKEN }}
          db-password: ${{ secrets.SUPABASE_LIVE_DB_PASSWORD }}
          mode: dry-run
      - name: Stop on destructive migration statements unless a human approved them
        env:
          DESTRUCTIVE_ACK: ${{ inputs.destructive_ack }}
        run: |
          set -euo pipefail
          flag=()
          if [ "$DESTRUCTIVE_ACK" = "true" ]; then flag=(--acknowledge-destructive); fi
          python3 infra/scripts/check_migrations.py --migrations supabase/migrations \
            --pending-file "$RUNNER_TEMP/migration-dry-run.txt" "${flag[@]}"
      - name: Apply the migrations and run the read-only schema tests
        uses: ./.github/actions/supabase-migrate
        with:
          project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          expected-project-ref: ${{ env.SUPABASE_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_LIVE_ACCESS_TOKEN }}
          db-password: ${{ secrets.SUPABASE_LIVE_DB_PASSWORD }}
          mode: push

      - name: Mark this release as in flight
        run: |
          set -euo pipefail
          latest_migration="$(ls supabase/migrations | sort | tail -n 1)"
          record="$(jq -cn --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg digest "$IMAGE_DIGEST" --arg run "$GITHUB_RUN_ID" \
            --arg migration "$latest_migration" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{releaseTag:$tag,releaseSha:$sha,imageDigest:$digest,frontendRunId:$run,frontendArtifact:"frontend-dist",latestMigration:$migration,startedAt:$at}')"
          aws ssm put-parameter --name "${SSM_PREFIX}release/attempt" --type String --overwrite --value "$record" > /dev/null
          echo "RELEASE_RECORD=$record" >> "$GITHUB_ENV"

      - uses: ./.github/actions/deploy-backend
        with:
          image-digest: ${{ env.IMAGE_DIGEST }}
          comment: INF-006 live release
      - uses: ./.github/actions/build-frontend
      - name: Keep the built frontend so a rollback can restore it
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 90
          if-no-files-found: error
      - uses: ./.github/actions/publish-frontend
      - uses: ./.github/actions/smoke
        with:
          expect-unauthenticated-rejected: "true"

      - name: Record the release
        run: |
          set -euo pipefail
          if [ "$PREVIOUS_RELEASE_RECORD" != "none" ]; then
            aws ssm put-parameter --name "${SSM_PREFIX}release/previous" --type String --overwrite \
              --value "$PREVIOUS_RELEASE_RECORD" > /dev/null
          fi
          aws ssm put-parameter --name "${SSM_PREFIX}release/current" --type String --overwrite --value "$RELEASE_RECORD" > /dev/null
          aws ssm put-parameter --name "${SSM_PREFIX}release/attempt" --type String --overwrite --value none > /dev/null
          {
            echo "### Live release succeeded"
            echo "- Release tag: \`$RELEASE_TAG\`"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Backend image: \`$IMAGE_DIGEST\`"
            echo "- Frontend artifact: \`frontend-dist\` in run $GITHUB_RUN_ID"
            echo "- Latest migration: \`$(ls supabase/migrations | sort | tail -n 1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rollback:
    name: roll back Live
    needs: guard
    if: inputs.mode == 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: live
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
        with:
          environment: live
          require-complete: "true"

      - name: Choose the last known-good release
        run: |
          set -euo pipefail
          read_record() { aws ssm get-parameter --name "${SSM_PREFIX}release/$1" --query Parameter.Value --output text 2>/dev/null || echo none; }
          attempt="$(read_record attempt)"
          current="$(read_record current)"
          previous="$(read_record previous)"
          if [ "$attempt" != "none" ]; then
            # A release started but never finished, so the one before it (current) is the known-good one.
            target="$current"; kind=attempt
          else
            target="$previous"; kind=previous
          fi
          if [ "$target" = "none" ]; then
            echo "REFUSED: there is no earlier release recorded to roll back to" >&2
            exit 1
          fi
          {
            echo "ROLLBACK_KIND=$kind"
            echo "ROLLBACK_SHA=$(jq -r .releaseSha <<< "$target")"
            echo "ROLLBACK_DIGEST=$(jq -r .imageDigest <<< "$target")"
            echo "ROLLBACK_RUN_ID=$(jq -r .frontendRunId <<< "$target")"
            echo "ROLLBACK_RECORD_CURRENT=$current"
            echo "ROLLBACK_RECORD_TARGET=$target"
          } >> "$GITHUB_ENV"
          echo "Rolling back to $(jq -r .releaseSha <<< "$target")"

      # Run from the release being restored, so its Compose file, Caddyfile and deploy script go to the host.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ROLLBACK_SHA }}
          persist-credentials: false
      - uses: ./.github/actions/deploy-backend
        with:
          image-digest: ${{ env.ROLLBACK_DIGEST }}
          comment: INF-006 live rollback
      - name: Fetch the frontend that matches that release
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          run-id: ${{ env.ROLLBACK_RUN_ID }}
          github-token: ${{ github.token }}
          path: restored-dist
      - uses: ./.github/actions/publish-frontend
        with:
          dist: restored-dist
      - uses: ./.github/actions/smoke
        with:
          expect-unauthenticated-rejected: "true"

      - name: Record the rollback
        run: |
          set -euo pipefail
          if [ "$ROLLBACK_KIND" = "previous" ]; then
            # A finished release is being undone: the release now serving becomes the one to forget.
            aws ssm put-parameter --name "${SSM_PREFIX}release/previous" --type String --overwrite \
              --value "$ROLLBACK_RECORD_CURRENT" > /dev/null
            aws ssm put-parameter --name "${SSM_PREFIX}release/current" --type String --overwrite \
              --value "$ROLLBACK_RECORD_TARGET" > /dev/null
          fi
          aws ssm put-parameter --name "${SSM_PREFIX}release/attempt" --type String --overwrite --value none > /dev/null
          {
            echo "### Live rollback succeeded"
            echo "- Restored commit: \`$ROLLBACK_SHA\`"
            echo "- Restored backend image: \`$ROLLBACK_DIGEST\`"
            echo "- The database was not changed. If the undone release changed the schema in a way the restored release cannot use, write a reviewed forward fix."
          } >> "$GITHUB_STEP_SUMMARY"
