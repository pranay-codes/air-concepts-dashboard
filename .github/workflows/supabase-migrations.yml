# DB-002: validate migrations on every pull request; apply new migrations to hosted Test after merge, then run integration tests against Test.
# Validate never touches hosted Test. Deploy only runs `db push` (new migrations), never reset. Integration tests on Test are read-only.
# INF-006: the steps that touch a hosted project live in .github/actions/supabase-migrate, shared with the Live release.
name: supabase-migrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/install-supabase-cli

      - name: Start throwaway local database
        run: supabase db start

      - name: Apply every migration and the seed from zero
        run: supabase db reset

      - name: Check the seed is re-runnable
        run: |
          set -euo pipefail
          db=$(docker ps --filter "name=supabase_db_" --format '{{.Names}}' | head -n 1)
          run_seed() {
            docker exec -i "$db" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q < supabase/seed.sql
          }
          run_seed
          run_seed
          count=$(docker exec "$db" psql -U postgres -d postgres -tA -c "select count(*) from public.entities")
          test "$count" = "3"

      - name: Run schema integration tests on the throwaway database
        run: supabase db query --read-only -f supabase/tests/schema_integration.sql

  deploy-test:
    name: deploy to Test
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: test
    # Queue merges so two deploys never push to Test at the same time.
    concurrency:
      group: supabase-test-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/supabase-migrate
        with:
          project-ref: ${{ secrets.SUPABASE_TEST_PROJECT_REF }}
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          db-password: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
