name: Infrastructure validation

on:
  pull_request:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infrastructure.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Docker Compose
        # Same release and checksum check as the host bootstrap. Installed under /usr/local so it
        # takes precedence over the runner's copy and is found even when the tests set DOCKER_CONFIG.
        env:
          COMPOSE_VERSION: v2.40.3
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          cd "$work_dir"
          base_url="https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}"
          curl --fail --silent --show-error --location --retry 3 -o docker-compose-linux-x86_64 "$base_url/docker-compose-linux-x86_64"
          curl --fail --silent --show-error --location --retry 3 -o checksums.txt "$base_url/checksums.txt"
          grep -E ' \*?docker-compose-linux-x86_64$' checksums.txt | sha256sum --check -
          sudo install -D -m 0755 docker-compose-linux-x86_64 /usr/local/lib/docker/cli-plugins/docker-compose
          docker compose version
      - run: python -m pip install -q -r infra/scripts/requirements-infrastructure.txt
      - run: python -m unittest discover -s infra/scripts -p test_infrastructure.py -q
      - run: cfn-lint infra/cloudformation/infrastructure.json --regions ap-southeast-2
      - name: Validate Compose structure without secrets or images
        # Prevent reading the runtime secret file during validation.
        env:
          ENVIRONMENT: test
          BACKEND_REPOSITORY_URI: 000000000000.dkr.ecr.ap-southeast-2.amazonaws.com/example
          BACKEND_IMAGE_DIGEST: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          CADDY_IMAGE_DIGEST: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          API_HOSTNAME: api.example.invalid
        run: docker compose -f infra/deploy/compose.yaml config --no-env-resolution --quiet
