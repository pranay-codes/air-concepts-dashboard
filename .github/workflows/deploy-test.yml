# CI-002: deploy the backend and frontend to the Test environment after a merge to main.
# Spec: docs/specs/CI-002-deploy-test.md. Plan: docs/plans/CI-002.md.
# INF-006: every environment value comes from infra/environments/test.json through the shared actions in
# .github/actions/, which the production release workflow also uses. This workflow can only target Test.
name: deploy-test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Package the backend jar
        working-directory: backend
        run: ./mvnw -q -B -DskipTests package
      - uses: ./.github/actions/setup-environment
        with:
          environment: test
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Check the base images include linux/arm64
        env:
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          caddy_digest="$(tr -d '\n' < infra/deploy/caddy-image.digest)"
          docker buildx imagetools inspect "eclipse-temurin:25-jre-noble@sha256:a98128a57de944a72bd31fbc79b898edd5a5864d3652071d5bbd2160ab7d7dce" > "$RUNNER_TEMP_DIR/temurin.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP_DIR/temurin.txt"
          docker buildx imagetools inspect "caddy@sha256:${caddy_digest}" > "$RUNNER_TEMP_DIR/caddy.txt"
          grep -q 'linux/arm64' "$RUNNER_TEMP_DIR/caddy.txt"
      - name: Build and push the arm64 backend image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          # Tags are immutable in ECR, so each run attempt gets its own tag. Deploys use the digest.
          tags: ${{ env.ECR_REPOSITORY_URI }}:${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

  deploy-backend:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
        with:
          environment: test
      - uses: ./.github/actions/deploy-backend
        with:
          image-digest: ${{ needs.build.outputs.image_digest }}
          comment: CI-002 deploy

  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
        with:
          environment: test
      - uses: ./.github/actions/build-frontend
      - uses: ./.github/actions/publish-frontend

  smoke:
    needs: deploy-frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-environment
        with:
          environment: test
          aws: "false"
      - uses: ./.github/actions/smoke
