# Required settings have no defaults. RequiredSettingsPostProcessor fails startup if one is missing.
spring:
  application:
    name: dashboard-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

dashboard:
  supabase:
    jwt-issuer-uri: ${SUPABASE_JWT_ISSUER_URI}
    jwks-uri: ${SUPABASE_JWKS_URI}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    com.airconcepts: debug

---
spring:
  config:
    activate:
      on-profile: test
management:
  health:
    db:
      enabled: false

---
spring:
  config:
    activate:
      on-profile: ci
management:
  health:
    db:
      enabled: false
